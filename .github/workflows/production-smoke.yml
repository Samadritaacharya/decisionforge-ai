name: Production Smoke Test

on:
  push:
    branches: [verify/fc4d-production]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify live Vercel production
        env:
          BASE_URL: https://decisionforge-ai.vercel.app
        run: node scripts/smoke-production.mjs
